[project]
name = "block-quiz"
version = "1.1.0"
description = "A Claude skill that quizzes you on a code change, one block at a time"
requires-python = ">=3.8"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 88
src = ["scripts"]
extend-exclude = ["*.md"]
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
