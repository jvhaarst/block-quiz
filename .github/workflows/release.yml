name: release

# Builds block-quiz.skill, the file claude.ai users upload, and attaches it to the
# release of the pushed tag. Only a tag starts this: a push to a branch never does.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run pytest
      - name: Build block-quiz.skill
        run: |
          # A .skill file is a zip with the skill folder at its top level.
          mkdir -p build/block-quiz
          cp -R SKILL.md LICENSE scripts build/block-quiz/
          cd build
          zip -r -X ../block-quiz.skill block-quiz -x '*/__pycache__/*'
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" block-quiz.skill --clobber
          else
            gh release create "$GITHUB_REF_NAME" block-quiz.skill \
              --verify-tag --generate-notes
          fi
